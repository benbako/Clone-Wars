- title: Light as material
  body: We design with the sun before we design with walls. Every opening is placed for the hour it will be lived in, not only for the photograph.

- title: Material honesty
  body: Wood remembers. Stone settles. Lime breathes. We choose materials that age in public and grow more articulate with use.

- title: Growth over finish
  body: A home is never complete; it is tended. We leave room for roots, for change, and for the seasons to redraw the plan.
