<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#F7F5F0">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}">
  <meta property="og:image" content="{{ page.image | default: '/assets/img/hero.jpg' | relative_url }}">
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/base.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/pages.css' | relative_url }}">
  <script>document.documentElement.classList.add('js');</script>
</head>
<body class="{{ page.body_class }}{% if page.layout == 'post' %} is-reading{% endif %}">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="page-bg" aria-hidden="true"></div>
  {% include nav.html %}
  <main id="main" tabindex="-1">
    {{ content }}
  </main>
  {% include footer.html %}
  <div class="cursor-image" aria-hidden="true"><img alt=""></div>
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
